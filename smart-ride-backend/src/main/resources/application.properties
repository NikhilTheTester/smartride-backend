server.port=8080
spring.application.name=smart-ride-backend

# ---------- MySQL (default) ----------
# The database "smartride_db" is created automatically. Change username/password to yours.
spring.datasource.url=jdbc:mysql://localhost:3306/smartride_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Kolkata
spring.datasource.username=root
spring.datasource.password=root

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=true

# ---------- Smart Ride settings ----------
# When a cab comes within this many metres of an employee's drop point, a voice alert is triggered
smartride.geofence.radius-meters=200
